<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>API 余额在线查询</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💳 额度查询工具</h2>
        <p style="color: gray; font-size: 14px;">请输入您购买的 API Key 进行查询</p>
        
        <input type="text" id="apiKey" placeholder="输入 sk- 开头的秘钥">
        <button onclick="checkBalance()">一键查询</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function checkBalance() {
            const key = document.getElementById('apiKey').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!key) {
                resultDiv.innerHTML = "❌ 请先输入秘钥！";
                resultDiv.style.color = "red";
                return;
            }

            resultDiv.innerHTML = "⏳ 查询中，请稍候...";
            resultDiv.style.color = "#007bff";

            try {
                // 向你的上游接口发送查询请求
                const response = await fetch('https://api.bltcy.ai/v1/dashboard/billing/subscription', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + key
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    // 大多数兼容平台用 hard_limit_usd 表示剩余额度
                    const balance = data.hard_limit_usd || 0;
                    resultDiv.innerHTML = "✅ 当前剩余额度：$" + balance.toFixed(4);
                    resultDiv.style.color = "green";
                } else {
                    resultDiv.innerHTML = "❌ 查询失败：秘钥错误或已失效。";
                    resultDiv.style.color = "red";
                }
            } catch (error) {
                resultDiv.innerHTML = "❌ 网络连接失败，请检查网络。";
                resultDiv.style.color = "red";
            }
        }
    </script>

</body>
</html>
